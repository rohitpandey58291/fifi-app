<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIFO Stock Allocation</title>
<style>
:root{--bg:#eef1ee;--ink:#14202b;--mut:#5b6b78;--card:#fff;--line:#d5dcd6;--acc:#0b6e66;--acc2:#e8f3f1;--warn:#b45309;--bad:#b42318;--good:#1a7f45}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--ink:#e6edf1;--mut:#97a6b2;--card:#18222b;--line:#2b3946;--acc:#3cc2b3;--acc2:#143531;--warn:#f0a040;--bad:#ff8a80;--good:#6fd69a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
nav{width:216px;background:#14202b;color:#dfe8ec;padding:16px 10px;flex-shrink:0;position:sticky;top:0;height:100vh}nav h1{font-size:15px;margin:4px 10px 14px;line-height:1.3}
nav a{display:block;padding:9px 12px;border-radius:6px;color:inherit;text-decoration:none;margin-bottom:2px}nav a.on,nav a:hover{background:#0b6e66;color:#fff}
main{flex:1;padding:22px;min-width:0}h2{margin:0 0 14px;font-size:22px}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi b{font-size:26px;display:block}.kpi span{color:var(--mut);font-size:13px}.kpi small{display:block;color:var(--mut);font-size:11px;margin-top:4px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mut);font-weight:600}.sc{overflow-x:auto}
.b{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--acc2);color:var(--acc)}.b.expired,.b.rejected,.b.blocked{background:#fde8e6;color:var(--bad)}.b.expiring,.b.pending,.b.partial{background:#fdf0dc;color:var(--warn)}.b.fulfilled,.b.ok{background:#e0f4e8;color:var(--good)}
button,select,input,textarea{font:inherit;color:inherit}button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer}button.g{background:transparent;color:var(--acc);border:1px solid var(--acc)}button.d{background:var(--bad)}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card)}:focus-visible{outline:3px solid #f5a623;outline-offset:1px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:10px}.err{color:var(--bad);font-weight:400;font-size:12.5px;display:block;min-height:0}.bad input,.bad select{border-color:var(--bad)}
.fg{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row select,.row input{width:auto}
.demo{background:#fdf0dc;color:#7a4a05;padding:6px 14px;font-size:13px;border-radius:6px;margin-bottom:12px}.toast{position:fixed;right:16px;bottom:16px;padding:10px 16px;border-radius:8px;color:#fff;background:var(--good);z-index:9}.toast.e{background:var(--bad)}
.exp{background:var(--acc2);border-left:4px solid var(--acc);padding:10px 12px;border-radius:4px;margin:10px 0;font-weight:600}.mut{color:var(--mut)}
#login{margin:12vh auto;max-width:360px;width:100%;padding:16px}svg text{fill:var(--ink);font-size:12px}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px}nav h1{width:100%}}
@media print{nav,.noprint,button{display:none!important}main{padding:0}body{display:block}}
</style></head><body><div id="app"></div><script>
const $=(s,r=document)=>r.querySelector(s),H=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=s=>s?new Date(s).toLocaleString():"",n=v=>Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
let me=null,view="dashboard";
async function api(p,body){let r;const hd={"Content-Type":"application/json"};if(sessionStorage.tok)hd.Authorization="Bearer "+sessionStorage.tok;
 try{r=await fetch("/api/"+p,{method:body?"POST":"GET",headers:hd,body:body?JSON.stringify(body):undefined})}catch(e){throw{error:"Cannot reach the server. Is python3 server.py running, and are you on http://localhost:8000?"}}
 const t=r.headers.get("content-type")||"";const d=t.includes("json")?await r.json().catch(()=>({})):await r.text();if(!r.ok){if(r.status==401&&me){me=null;boot()}throw{status:r.status,...d}}return d}
function toast(m,e){const t=document.createElement("div");t.className="toast"+(e?" e":"");t.textContent=m;t.setAttribute("role","status");document.body.append(t);setTimeout(()=>t.remove(),3500)}
function form(host,fields,submit,label){ // inline errors, values preserved
 host.innerHTML=`<div class="fg">${fields.map(f=>f.t=="hidden"?`<input type="hidden" name="${f.k}">`:`<label class="f-${f.k}">${f.l}${f.t=="select"?`<select name="${f.k}"><option value="">Select…</option>${f.o.map(o=>`<option value="${H(o[0])}">${H(o[1])}</option>`).join("")}</select>`:f.t=="area"?`<textarea name="${f.k}" rows="2"></textarea>`:`<input name="${f.k}" type="${f.t||"text"}" ${f.step?'step="any"':""}>`}<span class="err" aria-live="polite"></span></label>`).join("")}</div><button>${label}</button> <span class="err gen"></span>`;
 const w=document.createElement("form");w.noValidate=true;while(host.firstChild)w.append(host.firstChild);host.append(w);
 w.onsubmit=async e=>{e.preventDefault();w.querySelectorAll(".err").forEach(x=>x.textContent="");w.querySelectorAll(".bad").forEach(x=>x.classList.remove("bad"));
  const b=Object.fromEntries(new FormData(w));const pre={};fields.forEach(f=>{if(f.req&&!b[f.k])pre[f.k]="This field is required."});
  const show=er=>{for(const k in er){const l=$(".f-"+k,w);if(l){l.classList.add("bad");$(".err",l).textContent=er[k]}else $(".gen",w).textContent=er[k]}};
  if(Object.keys(pre).length)return show(pre);
  try{await submit(b);toast("Saved");w.reset()}catch(x){if(x.errors)show(x.errors);else toast(x.error||"Failed",1)}}}
function bars(data,labels,h=110){const m=Math.max(...data.flat(),1),w=Math.max(data.length*26,200);return `<div class="sc"><svg width="${w}" height="${h+24}" role="img" aria-label="bar chart">${data.map((v,i)=>`<g><rect x="${i*26+4}" y="${h-v/m*h}" width="18" height="${v/m*h}" fill="var(--acc)"><title>${labels[i]}: ${n(v)}</title></rect><text x="${i*26+13}" y="${h+14}" text-anchor="middle" font-size="10">${labels[i]}</text></g>`).join("")}</svg></div>`}
const fill=(host,o)=>{const w=$("form",host);for(const k in o)if(w.elements[k])w.elements[k].value=o[k]??"";host.scrollIntoView({behavior:"smooth"});w.elements[Object.keys(o)[1]].focus()};
const URG=["low","normal","high","critical"].map(x=>[x,x]);
const NAV=[["dashboard","Dashboard"],["inventory","Inventory"],["requests","Requests"],["allocation","Allocation"],["map","Map"],["forecast","Forecasting"],["reports","Reports"],["admin","Administration"]];
async function boot(){try{me=await api("me")}catch{me=null}
 if(!me){$("#app").innerHTML=`<div id="login" class="card"><h2>Sign in</h2><p class="mut">Demo mode. Demo accounts are listed in the README.</p><div id="lf"></div></div>`;
  form($("#lf"),[{k:"username",l:"Username",req:1},{k:"password",l:"Password",t:"password",req:1}],async b=>{try{const r=await api("login",b);sessionStorage.tok=r.token}catch(x){throw{errors:{_:x.error||"Sign-in failed. Check username and password."}}}boot()},"Sign in");return}
 $("#app").style.display="flex";$("#app").style.width="100%";
 $("#app").innerHTML=`<nav aria-label="Main"><h1>${H(me.org)}<br><small>${H(me.username)} · ${me.role}</small></h1>${NAV.map(([k,l])=>`<a href="#${k}" data-v="${k}">${l}</a>`).join("")}<a href="#" id="out">Sign out</a></nav><main id="m"></main>`;
 $("#out").onclick=async e=>{e.preventDefault();await api("logout",{});delete sessionStorage.tok;boot()};addEventListener("hashchange",go);go()}
async function go(){view=location.hash.slice(1)||"dashboard";document.querySelectorAll("nav a[data-v]").forEach(a=>a.classList.toggle("on",a.dataset.v==view));
 const m=$("#m");m.innerHTML="<p class='mut'>Loading…</p>";try{await V[view](m)}catch(x){m.innerHTML=`<div class="card"><b>Couldn't load this view.</b> ${H(x.error||x.message)}</div>`}}
const demo='<div class="demo">Demo data: all commodities, batches and requests below are sample records.</div>';
const V={};
V.dashboard=async m=>{const sel=+(sessionStorage.d||30);const d=await api("dashboard?days="+sel);const rq=Object.fromEntries(d.requests.map(r=>[r.status,r.n]));
 const wk={};d.series.forEach(s=>{(wk[s.day]=wk[s.day]||{receipt:0,issue:0})[s.type]=s.q});const days=Object.keys(wk).slice(-14);
 m.innerHTML=`<h2>Dashboard</h2>${demo}<div class="row noprint"><label style="margin:0">Period <select id="dp">${[7,30,90,365].map(v=>`<option ${v==sel?"selected":""} value="${v}">Last ${v} days</option>`).join("")}</select></label></div>
 <div class="grid">${[["Available eligible stock",n(d.available),"Sum of batch ledger balances, excluding expired/blocked"],["Tracked commodities",d.commodities,"Inventory › commodities"],["Received",n(d.received),"Ledger receipts, last "+d.days+"d"],["Issued",n(d.issued),"Ledger issues, last "+d.days+"d"],["Allocated",n(d.allocated),"FIFO allocations, last "+d.days+"d (Reports › allocations)"],["Open requests",rq.pending||0,`Fulfilled ${rq.fulfilled||0} · Partial ${rq.partial||0} · Rejected ${rq.rejected||0}`]].map(k=>`<div class="card kpi"><span>${k[0]}</span><b>${k[1]}</b><small>${k[2]}</small></div>`).join("")}</div>
 <div class="grid"><div class="card"><h3>Alerts</h3>${d.low.map(x=>`<div><span class="b pending">Low</span> ${H(x)}</div>`).join("")}${d.expiring.map(x=>`<div><span class="b expiring">Expiring</span> ${H(x.commodity)} ${H(x.batch_no)} · ${x.expiry}</div>`).join("")}${d.expired.map(x=>`<div><span class="b expired">Expired</span> ${H(x.commodity)} ${H(x.batch_no)} · ${n(x.balance)} on hand</div>`).join("")||""}${d.low.length+d.expiring.length+d.expired.length?"":"<span class='mut'>No alerts.</span>"}</div>
 <div class="card"><h3>Received vs issued (daily, last ${days.length} active days)</h3>${days.length?bars(days.map(x=>wk[x].issue),days.map(x=>x.slice(5)))+"<small class='mut'>Bars show units issued per day. Hover for values.</small>":"<span class='mut'>No transactions in this period.</span>"}</div>
 <div class="card"><h3>Demand forecast</h3>${d.forecast.map(f=>`<div>${H(f.commodity)}: ${n(f.projected_total)} next 4 wks vs ${n(f.stock)} stock ${f.at_risk?'<span class="b expired">may run short</span>':'<span class="b ok">covered</span>'} <span class="mut">confidence: ${f.confidence}</span></div>`).join("")}<small class="mut">Forecast ≠ confirmed inventory.</small></div></div>
 <div class="card"><h3>Recent activity</h3><div class="sc"><table>${d.activity.map(a=>`<tr><td>${dt(a.ts)}</td><td>${H(a.user)}</td><td>${H(a.action)}</td><td>${H(a.detail)}</td></tr>`).join("")}</table></div></div><p class="mut">Generated ${dt(d.generated)}</p>`;
 $("#dp").onchange=e=>{sessionStorage.d=e.target.value;go()}};
V.inventory=async m=>{const [cs,ls,bs]=await Promise.all([api("commodities"),api("locations"),api("batches")]);const can=p=>me.perms.includes(p);
 m.innerHTML=`<h2>Inventory</h2>${demo}<div class="card sc"><h3>Commodities</h3><table><tr><th>Name</th><th>Category</th><th>Unit</th><th>Eligible stock</th><th>Reorder at</th><th>Status</th><th></th></tr>${cs.map(c=>`<tr><td>${H(c.name)}</td><td>${H(c.category)}</td><td>${c.unit}</td><td>${n(c.stock)}</td><td>${n(c.reorder)}</td><td><span class="b ${c.low?"pending":"ok"}">${c.low?"Low":"OK"}</span></td><td>${can("commodity")?`<button class="g" data-ec="${c.id}">Edit</button>`:""}</td></tr>`).join("")}</table></div>
 <div class="card sc"><h3>Locations</h3><table><tr><th>Name</th><th>Type</th><th>Map position</th><th>Supplied by</th><th></th></tr>${ls.map(l=>`<tr><td>${H(l.name)}</td><td>${l.type}</td><td>${l.x}, ${l.y}</td><td>${H((ls.find(p=>p.id==l.parent_id)||{}).name||"–")}</td><td>${can("commodity")?`<button class="g" data-el="${l.id}">Edit</button>`:""}</td></tr>`).join("")}</table></div>
 <div class="card sc"><h3>Batches (oldest first)</h3><table><tr><th>Commodity</th><th>Batch</th><th>Location</th><th>Received</th><th>Expiry</th><th>Balance</th><th>Status</th><th></th></tr>${bs.map(b=>`<tr><td>${H(b.commodity)}</td><td>${H(b.batch_no)}</td><td>${H(b.location)}</td><td>${b.received}</td><td>${b.expiry}</td><td>${n(b.balance)} ${b.unit}</td><td><span class="b ${b.status}">${b.status}</span></td><td><button class="g" data-h="${b.id}">History</button> ${can("adjust")?`<button class="g" data-k="${b.id}" data-b="${b.blocked?0:1}">${b.blocked?"Unblock":"Block"}</button>`:""}</td></tr>`).join("")}</table><div id="hist"></div></div>
 ${can("commodity")?`<div class="card"><h3>Add or edit commodity</h3><div id="f1"></div></div>`:""}${can("commodity")?`<div class="card"><h3>Add or edit location</h3><div id="f4"></div></div>`:""}${can("receive")?`<div class="card"><h3>Receive stock</h3><div id="f2"></div></div>`:""}${can("adjust")?`<div class="card"><h3>Adjust stock (reason required)</h3><div id="f3"></div></div>`:""}`;
 m.onclick=async e=>{const t=e.target;if(t.dataset.h){const l=await api("ledger?batch="+t.dataset.h);$("#hist").innerHTML=`<h3>Transaction history</h3><table>${l.map(x=>`<tr><td>${dt(x.ts)}</td><td>${x.type}</td><td>${n(x.qty)}</td><td>${H(x.reason)} ${H(x.ref)}</td><td>${H(x.user)}</td></tr>`).join("")}</table>`}
  if(t.dataset.ec){const c=cs.find(x=>x.id==t.dataset.ec);fill($("#f1"),{id:c.id,name:c.name,category:c.category,unit:c.unit,reorder:c.reorder})}
  if(t.dataset.el){const l=ls.find(x=>x.id==t.dataset.el);fill($("#f4"),{id:l.id,name:l.name,type:l.type,x:l.x,y:l.y,parent_id:l.parent_id})}
  if(t.dataset.k){try{await api("block",{batch_id:t.dataset.k,blocked:+t.dataset.b});go()}catch(x){toast(x.error,1)}}};
 const co=cs.map(c=>[c.id,c.name]),lo=ls.map(l=>[l.id,l.name]);
 if($("#f1"))form($("#f1"),[{k:"id",t:"hidden"},{k:"name",l:"Name",req:1},{k:"category",l:"Category"},{k:"unit",l:"Unit",t:"select",o:["box","kg","litre","vial","pack","unit"].map(x=>[x,x]),req:1},{k:"reorder",l:"Reorder level",t:"number",step:1,req:1}],async b=>{await api("commodities",b);go()},"Save commodity");
 if($("#f4"))form($("#f4"),[{k:"id",t:"hidden"},{k:"name",l:"Name",req:1},{k:"type",l:"Type",t:"select",o:[["warehouse","warehouse"],["store","store"],["distribution","distribution point"]],req:1},{k:"x",l:"Map x (0-100)",t:"number",step:1,req:1},{k:"y",l:"Map y (0-100)",t:"number",step:1,req:1},{k:"parent_id",l:"Supplied by (route)",t:"select",o:lo}],async b=>{await api("locations",b);go()},"Save location");
 if($("#f2"))form($("#f2"),[{k:"commodity_id",l:"Commodity",t:"select",o:co,req:1},{k:"batch_no",l:"Batch number",req:1},{k:"supplier",l:"Supplier",req:1},{k:"qty",l:"Quantity",t:"number",step:1,req:1},{k:"received",l:"Received date",t:"date",req:1},{k:"expiry",l:"Expiry date",t:"date",req:1},{k:"unit_cost",l:"Unit cost",t:"number",step:1,req:1},{k:"location_id",l:"Location",t:"select",o:lo,req:1}],async b=>{await api("receive",b);go()},"Record receipt");
 if($("#f3"))form($("#f3"),[{k:"batch_id",l:"Batch",t:"select",o:bs.map(b=>[b.id,b.commodity+" "+b.batch_no+" ("+n(b.balance)+")"]),req:1},{k:"qty",l:"Change (+/−)",t:"number",step:1,req:1},{k:"reason",l:"Reason",t:"area",req:1}],async b=>{await api("adjust",b);go()},"Record adjustment")};
V.requests=async m=>{const [rs,cs,ls]=await Promise.all([api("requests"),api("commodities"),api("locations")]);
 m.innerHTML=`<h2>Requests</h2>${demo}${me.perms.includes("request")?`<div class="card"><h3>Submit a request</h3><div id="f"></div></div>`:""}<div class="card sc"><h3>${me.role=="requester"?"My requests":"All requests"}</h3><table><tr><th>#</th><th>Commodity</th><th>Qty</th><th>To</th><th>Status</th><th>Urgency</th><th>Purpose</th><th>Requested</th><th>Allocated from</th></tr>${rs.map(r=>`<tr><td>${r.id}</td><td>${H(r.commodity)}</td><td>${n(r.qty)} ${r.unit}</td><td>${H(r.location)}</td><td><span class="b ${r.status}">${r.status}</span></td><td><span class="b ${r.urgency=="critical"||r.urgency=="high"?"pending":""}">${r.urgency}</span></td><td>${H(r.purpose)}</td><td>${dt(r.created)}</td><td>${r.allocations.map(a=>n(a.qty)+" from "+H(a.batch_no)).join(", ")||"–"}</td></tr>`).join("")||"<tr><td colspan=9 class='mut'>No requests yet.</td></tr>"}</table></div>`;
 if($("#f"))form($("#f"),[{k:"commodity_id",l:"Commodity",t:"select",o:cs.map(c=>[c.id,c.name]),req:1},{k:"qty",l:"Quantity",t:"number",step:1,req:1},{k:"location_id",l:"Deliver to",t:"select",o:ls.map(l=>[l.id,l.name]),req:1},{k:"urgency",l:"Urgency",t:"select",o:URG,req:1},{k:"purpose",l:"Purpose",t:"area",req:1}],async b=>{await api("requests",b);go()},"Submit request")};
V.allocation=async m=>{if(!me.perms.includes("allocate")){m.innerHTML=`<h2>Allocation</h2><div class="card">Your role (${me.role}) can't approve allocations. Ask an inventory manager.</div>`;return}
 const ord={critical:0,high:1,normal:2,low:3};const rs=(await api("requests")).filter(r=>r.status=="pending").sort((a,b)=>ord[a.urgency]-ord[b.urgency]||a.id-b.id);
 m.innerHTML=`<h2>FIFO allocation</h2>${demo}<p class="mut">Oldest eligible batch first (received date, then batch number). Expired and blocked batches are skipped.</p><div class="card sc"><h3>Pending requests</h3><table>${rs.map(r=>`<tr><td>#${r.id}</td><td>${H(r.commodity)}</td><td>${n(r.qty)} ${r.unit}</td><td>${H(r.location)}</td><td><span class="b ${ord[r.urgency]<2?"pending":""}">${r.urgency}</span></td><td>${H(r.purpose)}</td><td><button data-p="${r.id}">Preview</button></td></tr>`).join("")||"<tr><td class='mut'>No pending requests. Submit one under Requests.</td></tr>"}</table></div><div id="pv"></div>`;
 m.onclick=async e=>{const id=e.target.dataset.p;if(!id)return;const p=await api("preview?request="+id);const act=async a=>{try{const r=await api("allocate",{request_id:+id,action:a});toast(a=="reject"?"Rejected":"Allocated: "+(r.explanation||""));go()}catch(x){toast(Object.values(x.errors||{})[0]||x.error,1)}};
  $("#pv").innerHTML=`<div class="card"><h3>Allocation preview for request #${id}</h3><div class="exp">${H(p.explanation)}</div><table><tr><th>Batch</th><th>Received</th><th>Expiry</th><th>Location</th><th>Take</th></tr>${p.plan.map(x=>`<tr><td>${H(x.batch_no)}</td><td>${x.received}</td><td>${x.expiry}</td><td>${H(x.location)}</td><td>${n(x.qty)}</td></tr>`).join("")}</table>${p.shortfall>0?`<p><span class="b expired">Short by ${n(p.shortfall)}</span> Only ${n(p.available)} eligible units exist.</p>`:""}<div class="row" style="margin-top:10px">${p.shortfall>0?'<button id="a2">Confirm partial</button>':'<button id="a1">Confirm allocation</button>'}<button class="d" id="a3">Reject request</button></div></div>`;
  $("#a1")&&($("#a1").onclick=()=>act("full"));$("#a2")&&($("#a2").onclick=()=>act("partial"));$("#a3").onclick=()=>act("reject")}};
V.map=async m=>{const cs=await api("commodities");const cid=sessionStorage.mc||"";const ls=await api("map?commodity="+cid);const sel=+(sessionStorage.ml||ls[0].id);const L=ls.find(l=>l.id==sel);
 m.innerHTML=`<h2>Locations</h2>${demo}<div class="row"><label style="margin:0">Commodity <select id="mc"><option value="">All</option>${cs.map(c=>`<option ${c.id==cid?"selected":""} value="${c.id}">${H(c.name)}</option>`).join("")}</select></label><span class="mut">Interactive schematic map (no external map service needed). Lines are transfer routes.</span></div>
 <div class="grid" style="grid-template-columns:minmax(300px,2fr) 1fr"><div class="card"><svg viewBox="0 0 100 100" style="width:100%;max-height:480px" role="img" aria-label="Schematic location map"><rect width="100" height="100" fill="var(--acc2)" rx="3"/>${ls.filter(l=>l.parent_id).map(l=>{const p=ls.find(x=>x.id==l.parent_id);return `<line x1="${p.x}" y1="${p.y}" x2="${l.x}" y2="${l.y}" stroke="var(--acc)" stroke-dasharray="2 1.5" stroke-width=".6"/>`}).join("")}${ls.map(l=>`<g tabindex="0" role="button" data-l="${l.id}" style="cursor:pointer"><circle cx="${l.x}" cy="${l.y}" r="${l.id==sel?6:4.5}" fill="${l.low?"var(--bad)":l.open_requests?"var(--warn)":"var(--acc)"}" stroke="#fff" stroke-width="1"/><text x="${l.x}" y="${l.y+10}" text-anchor="middle" style="font-size:3.4px">${H(l.name)}</text><text x="${l.x}" y="${l.y+1.2}" text-anchor="middle" style="font-size:3px;fill:#fff">${n(l.stock)}</text></g>`).join("")}</svg><small class="mut">Red: none of selected commodity · Amber: open requests · Teal: stocked</small></div>
 <div class="card"><h3>${H(L.name)}</h3><p>${L.type} · Stock ${n(L.stock)} · Open requests ${L.open_requests}</p><table>${L.batches.map(b=>`<tr><td>${H(b.commodity)}</td><td>${H(b.batch_no)}</td><td>${n(b.balance)} ${b.unit}</td><td><span class="b ${b.status}">${b.status}</span></td></tr>`).join("")||"<tr><td class='mut'>No stock here for this filter.</td></tr>"}</table></div></div>`;
 $("#mc").onchange=e=>{sessionStorage.mc=e.target.value;go()};m.querySelectorAll("[data-l]").forEach(g=>{const f=()=>{sessionStorage.ml=g.dataset.l;go()};g.onclick=f;g.onkeydown=e=>e.key=="Enter"&&f()})};
V.forecast=async m=>{const cs=await api("commodities");const cid=sessionStorage.fc||cs[0].id;const f=await api("forecast?commodity="+cid);const hs=f.history.slice(-8);
 m.innerHTML=`<h2>Forecasting</h2>${demo}<div class="row"><label style="margin:0">Commodity <select id="fc">${cs.map(c=>`<option ${c.id==cid?"selected":""} value="${c.id}">${H(c.name)}</option>`).join("")}</select></label></div>
 ${f.sample?'<div class="demo">Too little history (fewer than 4 weeks). This is a labeled SAMPLE forecast, not a reliable prediction.</div>':""}<div class="card"><h3>Weekly demand: history (left) and projection (right)</h3>${bars([...hs,...f.projection],[...hs.map((_,i)=>"-"+(hs.length-i)+"w"),..."1234".split("").map(x=>"+"+x+"w")])}<p class="mut">First ${hs.length} bars are actual issues; last 4 are projected.</p></div>
 <div class="grid"><div class="card kpi"><span>Projected 4-week demand</span><b>${n(f.projected_total)}</b></div><div class="card kpi"><span>Confirmed eligible stock</span><b>${n(f.stock)}</b></div><div class="card kpi"><span>Confidence</span><b>${f.confidence}</b><small>Variation ${f.cv}</small></div></div>
 ${f.at_risk?'<div class="card"><span class="b expired">Warning</span> Projected demand may exceed available stock.</div>':""}<div class="card"><h3>Assumptions</h3><ul><li>Method: ${H(f.method)}.</li><li>Data period: ${f.weeks_of_data} weeks of issue transactions.</li><li>Receipts, expiry and transfers are not modelled.</li><li>Forecasts are estimates, never confirmed inventory.</li></ul></div>`;
 $("#fc").onchange=e=>{sessionStorage.fc=e.target.value;go()}};
V.reports=async m=>{const cs=await api("commodities");const R={inventory:"Current inventory",allocations:"FIFO allocation history",transactions:"Receipts, issues, adjustments",expiry:"Expiring and expired stock",forecast_vs_actual:"Forecast vs actual"};
 m.innerHTML=`<h2>Reports</h2>${demo}<div class="row noprint"><select id="rn">${Object.entries(R).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><select id="rc"><option value="">All commodities</option>${cs.map(c=>`<option value="${c.id}">${H(c.name)}</option>`).join("")}</select><select id="rt"><option value="">All types</option><option>receipt</option><option>issue</option><option>adjustment</option></select><input id="rf" type="date" aria-label="From date"><button id="go">Run</button><button class="g" id="csv">Export CSV</button><button class="g" id="pdf">Print / PDF</button></div><div id="out"></div>`;
 const qs=()=>`${$("#rn").value}?commodity=${$("#rc").value}&type=${$("#rt").value}&from=${$("#rf").value}`;
 const run=async()=>{const r=await api("report/"+qs());$("#out").innerHTML=`<div class="card sc"><h3>${R[$("#rn").value]}</h3><p class="mut">Generated ${dt(r.generated)} · Filters: ${H(JSON.stringify(r.filters))}</p><table>${r.rows.length?`<tr>${Object.keys(r.rows[0]).map(k=>`<th>${k}</th>`).join("")}</tr>`+r.rows.map(x=>`<tr>${Object.values(x).map(v=>`<td>${H(v)}</td>`).join("")}</tr>`).join(""):"<tr><td class='mut'>No rows match these filters.</td></tr>"}</table></div>`};
 $("#go").onclick=run;$("#csv").onclick=()=>location.href="/api/report/"+qs()+"&format=csv";$("#pdf").onclick=async()=>{await run();print()};run()};
V.admin=async m=>{if(!me.perms.includes("audit")){m.innerHTML=`<h2>Administration</h2><div class="card">Your role (${me.role}) can't open this area.</div>`;return}
 const au=await api("audit");const us=me.role=="admin"?await api("users"):[];
 m.innerHTML=`<h2>Administration</h2>${me.role=="admin"?`<div class="card"><h3>Users and roles</h3><table>${us.map(u=>`<tr><td>${H(u.username)}</td><td><select data-u="${u.username}">${["admin","manager","requester","viewer"].map(r=>`<option ${r==u.role?"selected":""}>${r}</option>`).join("")}</select></td></tr>`).join("")}</table></div><div class="card"><h3>Organization name</h3><div id="fs"></div></div>`:""}<div class="card sc"><h3>Audit log (latest 100)</h3><table><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th></tr>${au.map(a=>`<tr><td>${dt(a.ts)}</td><td>${H(a.user)}</td><td>${H(a.action)}</td><td>${H(a.detail)}</td></tr>`).join("")}</table></div>`;
 m.onchange=async e=>{if(e.target.dataset.u){try{await api("user_role",{username:e.target.dataset.u,role:e.target.value});toast("Role updated");}catch(x){toast(Object.values(x.errors||{})[0]||x.error,1);go()}}};
 $("#fs")&&form($("#fs"),[{k:"org_name",l:"Name shown in the sidebar",req:1}],async b=>{await api("settings",b);boot()},"Save")};
boot();
</script></body></html>
